apiVersion: apps/v1
kind: Deployment
metadata:
  name: html-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: html-project
  template:
    metadata:
      labels:
        app: html-project
    spec:
      containers:
        - name: html-project
          image: balumidikondla/html_project:latest
          ports:
            - containerPort: 80
